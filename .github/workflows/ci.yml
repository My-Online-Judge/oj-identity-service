name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # oj-common is not published to a Maven repository yet. The job checks this tag out next to the
  # service (the same sibling layout the Dockerfile and judge-deployment use) and installs it.
  oj-common-ref: v0.9.0
  IMAGE: docker.io/thanhtuanle/oj-identity-service
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: oj-identity-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oj-identity-service
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: My-Online-Judge/oj-common
          ref: ${{ env.oj-common-ref }}
          path: oj-common
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - run: ./mvnw -B -f ../oj-common/pom.xml install -DskipTests
      - name: Test (Testcontainers enforced)
        # Postgres runs through Testcontainers. Deactivating their execution condition turns
        # "Docker unavailable on the runner" into a failure instead of a silent skip.
        run: ./mvnw -B verify '-Djunit.jupiter.conditions.deactivate=org.testcontainers.*'
      - name: Build image
        run: >-
          docker build --build-context oj-common=../oj-common
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
      - name: Runs as uid 10001
        run: test "$(docker run --rm --entrypoint id "$IMAGE:${{ github.sha }}" -u)" = 10001
      - name: Trivy (CRITICAL with a fix fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: oj-identity-service/.trivyignore
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE:${{ github.sha }}" && docker push "$IMAGE:main"
