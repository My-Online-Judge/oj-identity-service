version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        # 2025.1 (Oakwood) needs Spring Boot 4: only with the Boot 4 migration.
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.grpc:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springdoc:*"
        # springdoc 3.x needs Spring Boot 4: only with the Boot 4 migration.
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        # The tag 3.9-eclipse-temurin-17 floats on Maven 3.9; the only updates Dependabot finds are JDK-suffix flips
        # (-26), filed as minor. The JDK moves only with a deliberate upgrade of both images.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
